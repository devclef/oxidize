<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/api/manifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxidize - Average Cost</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .avg-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .avg-header {
            display: flex;
            gap: 20px;
            align-items: flex-end;
            margin-bottom: 20px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            flex-wrap: wrap;
        }

        .avg-header .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .avg-header label {
            font-weight: 600;
            font-size: 0.85em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .avg-header select,
        .avg-header input[type="number"] {
            padding: 6px 10px;
            font-size: 0.95em;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-color);
            color: var(--text-color);
            min-width: 120px;
        }

        .selectors-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .selector-panel {
            padding: 20px;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--card-shadow);
        }

        .selector-panel h3 {
            margin: 0 0 12px 0;
            font-size: 0.95em;
            color: var(--text-muted);
        }

        .selector-list {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            background: var(--bg-color);
        }

        .selector-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            cursor: pointer;
        }

        .selector-item:hover {
            background: var(--card-bg);
            border-radius: 4px;
        }

        .selector-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .selector-actions button {
            padding: 6px 12px;
            font-size: 0.85em;
            cursor: pointer;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .mode-toggle {
            display: flex;
            gap: 0;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .mode-toggle input[type="radio"] {
            display: none;
        }

        .mode-toggle label {
            padding: 6px 14px;
            font-size: 0.9em;
            cursor: pointer;
            background: var(--bg-color);
            color: var(--text-color);
            border-right: 1px solid var(--border-color);
            text-transform: none;
            letter-spacing: normal;
            transition: background 0.15s;
        }

        .mode-toggle label:last-of-type {
            border-right: none;
        }

        .mode-toggle input[type="radio"]:checked + label {
            background: var(--accent-color);
            color: white;
        }

        .compute-btn {
            padding: 8px 24px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: var(--accent-color);
            color: white;
            transition: background 0.15s;
        }

        .compute-btn:hover {
            background: var(--accent-hover);
        }

        .compute-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-section {
            margin-top: 24px;
        }

        .results-table-wrapper {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--card-shadow);
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .results-table th {
            text-align: left;
            padding: 10px 14px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .results-table td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-color);
        }

        .results-table tr:last-child td {
            border-bottom: none;
        }

        .results-table .avg-cell {
            font-weight: 700;
            font-size: 1.05em;
            color: var(--accent-color);
        }

        .results-table .bar-cell {
            min-width: 180px;
        }

        .mini-bar-container {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 40px;
        }

        .mini-bar {
            flex: 1;
            background: var(--accent-color);
            border-radius: 2px 2px 0 0;
            min-width: 4px;
            max-width: 20px;
            position: relative;
            cursor: default;
            transition: opacity 0.15s;
        }

        .mini-bar:hover {
            opacity: 0.75;
        }

        .mini-bar .bar-tooltip {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 0.8em;
            white-space: nowrap;
            z-index: 10;
            color: var(--text-color);
            box-shadow: var(--shadow-md);
        }

        .mini-bar:hover .bar-tooltip {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
            color: var(--text-muted);
        }

        .error {
            background: var(--error-bg);
            color: var(--error-color);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--error-color);
        }

        .dark .error {
            background: color-mix(in srgb, var(--error-bg) 60%, black);
            color: var(--error-color);
        }

        .nav {
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.5em;
        }

        .no-data-msg {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1.1em;
        }

        .sort-link {
            cursor: pointer;
            color: var(--accent-color);
            text-decoration: underline;
        }

        .sort-link:hover {
            color: var(--accent-hover);
        }

        .results-table tr.total-row td {
            font-weight: 700;
            border-top: 2px solid var(--border-color);
            background: var(--border-light);
        }

        @media (max-width: 768px) {
            .selectors-row {
                grid-template-columns: 1fr;
            }

            .avg-header {
                flex-direction: column;
                align-items: stretch;
            }

        }

    </style>
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none;">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39 -1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39 -1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39 -1.03-.39-1.41 0l-1.06 1.06c-.39-.39 -1.03 0 1.41 s1.03 .39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39 -1.03-.39-1.41 0l-1.06 1.06c-.39-.39 -1.03 0 1.41 s1.03 .39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
    </button>
    <nav class="nav">
        <a href="/">Graph Builder</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/budget-comparison">Budget Comparison</a>
        <a href="/avg-cost" class="active">Avg Cost</a>
        <a href="/sankey">Sankey Flow</a>
    </nav>

    <h1>Average Cost per Budget</h1>

    <div class="avg-container">
        <div class="selectors-row">
            <div class="selector-panel">
                <h3>Select Budgets</h3>
                <div class="selector-actions">
                    <button id="select-all-budgets">Select All</button>
                    <button id="deselect-all-budgets">Deselect All</button>
                </div>
                <div class="selector-list" id="budget-list">
                    <div class="loading">Loading budgets...</div>
                </div>
            </div>
            <div class="selector-panel">
                <h3>Select Accounts (optional)</h3>
                <div class="selector-actions">
                    <button id="select-all-accounts">Select All</button>
                    <button id="deselect-all-accounts">Deselect All</button>
                </div>
                <div class="selector-list" id="account-list">
                    <div class="loading">Loading accounts...</div>
                </div>
            </div>
        </div>

        <div class="avg-header">
            <div class="field">
                <label>Calculation Mode</label>
                <div class="mode-toggle">
                    <input type="radio" id="mode-last-n" name="calc-mode" value="last_n_months" checked>
                    <label for="mode-last-n">Last N Months</label>
                    <input type="radio" id="mode-prev-year" name="calc-mode" value="previous_year_same_month">
                    <label for="mode-prev-year">Previous Year Same Month</label>
                </div>
            </div>
            <div class="field" id="months-field">
                <label for="months-select">Months</label>
                <select id="months-select">
                </select>
            </div>
            <div class="field" id="month-nav-field" style="display: none;">
                <label>Month</label>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <button class="compute-btn" id="month-prev-btn" style="padding: 6px 12px; font-size: 0.85em;">◀</button>
                    <span id="month-label" style="min-width: 120px; text-align: center; font-weight: 600; font-size: 0.95em;"></span>
                    <button class="compute-btn" id="month-next-btn" style="padding: 6px 12px; font-size: 0.85em;">▶</button>
                </div>
            </div>
            <button class="compute-btn" id="compute-btn">Compute</button>
        </div>

        <div id="error-container" class="error" style="display: none;"></div>

        <div id="results-section" class="results-section" style="display: none;">
            <div class="results-table-wrapper">
                <table class="results-table" id="results-table">
                    <thead>
                        <tr>
                            <th>Budget</th>
                            <th>Avg / Month <span class="sort-link" id="sort-avg">↕</span></th>
                            <th>Total <span class="sort-link" id="sort-total">↕</span></th>
                            <th>Min</th>
                            <th>Max</th>
                            <th>Months</th>
                            <th class="bar-cell">Monthly Breakdown</th>
                        </tr>
                    </thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>
        </div>

        <div id="no-data-msg" class="no-data-msg" style="display: none;">
            Select at least one budget and click Compute to see results.
        </div>
    </div>

<script>
    const THEME_KEY = 'oxidize_theme';
    const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    let allBudgetsData = [];
    let sortField = 'avg';
    let sortAsc = false;
    let navMonth = null;   // 1-12, for Previous Year Same Month navigation
    let navYear = null;    // target year for comparison
    let lastAvgCostData = null;  // cache last response for re-render

    function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon-sun').style.display = 'none';
            document.getElementById('theme-icon-moon').style.display = 'block';
        }
 else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.getElementById('theme-icon-sun').style.display = 'block';
            document.getElementById('theme-icon-moon').style.display = 'none';
        }

    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem(THEME_KEY, next);
        document.getElementById('theme-icon-sun').style.display = next === 'light' ? 'block' : 'none';
        document.getElementById('theme-icon-moon').style.display = next === 'dark' ? 'block' : 'none';
    }

    function formatCurrency(amount, symbol, code) {
        const s = symbol || code || '';
        return s + amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    async function loadBudgets() {
        try {
            const response = await fetch('/api/budgets/list');
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const budgets = await response.json();
            const container = document.getElementById('budget-list');
            if (budgets.length === 0) {
                container.innerHTML = '<div class="loading">No budgets found.</div>';
                return;
            }

            container.innerHTML = budgets.map(b =>
                '<div class="selector-item">' +
                    '<input type="checkbox" id="b-' + b.id + '" value="' + b.id + '" data-name="' + b.name + '" class="budget-cb">' +
                    '<label for="b-' + b.id + '">' + b.name + '</label>' +
                '</div>'
            ).join('');
        }
 catch (e) {
            document.getElementById('budget-list').innerHTML =
                '<div class="error">Failed to load budgets: ' + e.message + '</div>';
        }

    }

    async function loadAccounts() {
        try {
            const CONFIG = window.OXIDIZE_CONFIG || { accountTypes: [] };
            const accounts = [];
            for (const type of CONFIG.accountTypes) {
                const resp = await fetch('/api/accounts?type=' + type);
                if (resp.ok) {
                    const arr = await resp.json();
                    accounts.push(...arr);
                }

            }

            const container = document.getElementById('account-list');
            if (accounts.length === 0) {
                container.innerHTML = '<div class="loading">No accounts found.</div>';
                return;
            }

            container.innerHTML = accounts.map(a =>
                '<div class="selector-item">' +
                    '<input type="checkbox" id="a-' + a.id + '" value="' + a.id + '" class="account-cb">' +
                    '<label for="a-' + a.id + '">' + a.name + '</label>' +
                '</div>'
            ).join('');
        }
 catch (e) {
            document.getElementById('account-list').innerHTML =
                '<div class="error">Failed to load accounts: ' + e.message + '</div>';
        }

    }

    function getSelectedBudgets() {
        return Array.from(document.querySelectorAll('.budget-cb:checked'))
            .map(cb => ({ id: cb.value, name: cb.dataset.name }));
    }

    function getSelectedAccountIds() {
        return Array.from(document.querySelectorAll('.account-cb:checked'))
            .map(cb => cb.value);
    }

    function updateMonthLabel() {
        const label = MONTH_NAMES[(navMonth - 1) % 12] + ' ' + navYear;
        document.getElementById('month-label').textContent = label;
    }

    async function computeAvgCost() {
        const selected = getSelectedBudgets();
        const errorContainer = document.getElementById('error-container');
        const resultsSection = document.getElementById('results-section');
        const noDataMsg = document.getElementById('no-data-msg');

        if (selected.length === 0) {
            errorContainer.style.display = 'none';
            resultsSection.style.display = 'none';
            noDataMsg.style.display = 'block';
            return;
        }

        noDataMsg.style.display = 'none';
        errorContainer.style.display = 'none';
        document.getElementById('results-body').innerHTML = '<tr><td colspan="7" class="loading">Computing...</td></tr>';
        resultsSection.style.display = 'block';

        const mode = document.querySelector('input[name="calc-mode"]:checked').value;
        const months = document.getElementById('months-select').value;
        const accountIds = getSelectedAccountIds();

        const params = new URLSearchParams();
        selected.forEach(b => params.append('budget_names', b.name));
        params.append('mode', mode);
        params.append('months', months);
        if (mode === 'previous_year_same_month' && navMonth && navYear) {
            params.append('month', navMonth);
            params.append('year', navYear);
        }
        if (accountIds.length > 0) {
            params.append('account_ids', accountIds.join(','));
        }


        try {
            const response = await fetch('/api/budgets/avg-cost?' + params.toString());
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const data = await response.json();
            lastAvgCostData = data;
            // Update navigation state from response
            if (data.target_month && data.target_year) {
                navMonth = data.target_month;
                navYear = data.target_year;
                updateMonthLabel();
            }
            renderResults(data);
        }
 catch (e) {
            errorContainer.textContent = 'Failed to compute: ' + e.message;
            errorContainer.style.display = 'block';
            resultsSection.style.display = 'none';
        }

    }

    function renderResults(data) {
        const tbody = document.getElementById('results-body');
        if (!data.budgets || data.budgets.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="loading">No data found for the selected filters.</td></tr>';
            return;
        }


        // Sort
        const sorted = [...data.budgets];
        sorted.sort((a, b) => {
            let va, vb;
            if (sortField === 'avg') { va = a.average_cost; vb = b.average_cost; }
            else { va = a.total_spend; vb = b.total_spend; }
            return sortAsc ? va - vb : vb - va;
        }
);

        // Determine currency from first budget
        const symbol = data.budgets[0].currency_symbol || data.budgets[0].currency_code || '';

        tbody.innerHTML = sorted.map(b => {
            const maxAmount = Math.max(...b.monthly_data.map(m => m.amount), 1);
            const bars = b.monthly_data.map(m => {
                const height = Math.max((m.amount / maxAmount) * 100, 3);
                return '<div class="mini-bar" style="height:' + height + '%">' +
                    '<span class="bar-tooltip">' + m.label + ': ' + formatCurrency(m.amount, symbol) + '</span>' +
                '</div>';
            }
).join('');

            const modeLabel = data.mode === 'last_n_months'
                ? 'Avg of last ' + data.months_count + ' months'
                : 'Same month last year';

            return '<tr>' +
                '<td><strong>' + b.budget_name + '</strong></td>' +
                '<td class="avg-cell">' + formatCurrency(b.average_cost, symbol) + '</td>' +
                '<td>' + formatCurrency(b.total_spend, symbol) + '</td>' +
                '<td>' + formatCurrency(b.min_spend, symbol) + '</td>' +
                '<td>' + formatCurrency(b.max_spend, symbol) + '</td>' +
                '<td>' + b.monthly_data.length + ' (' + modeLabel + ')</td>' +
                '<td class="bar-cell"><div class="mini-bar-container">' + bars + '</div></td>' +
            '</tr>';
        }
).join('');

        // Add total row
        const totalAvg = sorted.reduce((s, b) => s + b.average_cost, 0);
        const totalSpend = sorted.reduce((s, b) => s + b.total_spend, 0);
        const totalMin = sorted.reduce((s, b) => s + b.min_spend, 0);
        const totalMax = sorted.reduce((s, b) => s + b.max_spend, 0);
        tbody.innerHTML += '<tr class="total-row">' +
            '<td>Total</td>' +
            '<td class="avg-cell">' + formatCurrency(totalAvg, symbol) + '</td>' +
            '<td>' + formatCurrency(totalSpend, symbol) + '</td>' +
            '<td>' + formatCurrency(totalMin, symbol) + '</td>' +
            '<td>' + formatCurrency(totalMax, symbol) + '</td>' +
            '<td>\u2014</td>' +
            '<td></td>' +
        '</tr>';
    }

    document.addEventListener('DOMContentLoaded', () => {
        initTheme();
        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/static/sw.js");
        }


        // Populate months dropdown
        const monthsSelect = document.getElementById('months-select');
        for (let i = 1; i <= 24; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i + (i === 1 ? ' month' : ' months');
            if (i === 6) opt.selected = true;
            monthsSelect.appendChild(opt);
        }


        // Mode toggle: show/hide months field and month nav
        const monthsField = document.getElementById('months-field');
        const monthNavField = document.getElementById('month-nav-field');
        const now = new Date();
        document.querySelectorAll('input[name="calc-mode"]').forEach(radio => {
            radio.addEventListener('change', () => {
                monthsField.style.display = radio.value === 'last_n_months' ? 'flex' : 'none';
                if (radio.value === 'previous_year_same_month') {
                    monthNavField.style.display = 'flex';
                    // Default to current month of previous year
                    navMonth = now.getMonth() + 1; // 1-12
                    navYear = now.getFullYear() - 1;
                    updateMonthLabel();
                } else {
                    monthNavField.style.display = 'none';
                }
            }
);
        }
);

        // Select/deselect all
        document.getElementById('select-all-budgets').addEventListener('click', () => {
            document.querySelectorAll('.budget-cb').forEach(cb => cb.checked = true);
        }
);
        document.getElementById('deselect-all-budgets').addEventListener('click', () => {
            document.querySelectorAll('.budget-cb').forEach(cb => cb.checked = false);
        }
);
        document.getElementById('select-all-accounts').addEventListener('click', () => {
            document.querySelectorAll('.account-cb').forEach(cb => cb.checked = true);
        }
);
        document.getElementById('deselect-all-accounts').addEventListener('click', () => {
            document.querySelectorAll('.account-cb').forEach(cb => cb.checked = false);
        }
);

        // Compute button
        document.getElementById('compute-btn').addEventListener('click', computeAvgCost);

        // Month navigation buttons
        document.getElementById('month-prev-btn').addEventListener('click', () => {
            navMonth -= 1;
            if (navMonth < 1) { navMonth = 12; navYear -= 1; }
            updateMonthLabel();
            computeAvgCost();
        });
        document.getElementById('month-next-btn').addEventListener('click', () => {
            navMonth += 1;
            if (navMonth > 12) { navMonth = 1; navYear += 1; }
            updateMonthLabel();
            computeAvgCost();
        });

        // Sort handlers
        document.getElementById('sort-avg').addEventListener('click', () => {
            sortField = 'avg';
            sortAsc = !sortAsc;
            document.querySelectorAll('.sort-link').forEach(el => el.textContent = '↕');
            document.getElementById('sort-avg').textContent = sortAsc ? '↑' : '↓';
            // Re-render with current data by re-reading the table
            const rows = Array.from(document.querySelectorAll('#results-body tr'));
            if (rows.length && !rows[0].classList.contains('loading')) {
                // We need the raw data, so re-compute
                computeAvgCost();
            }

        }
);
        document.getElementById('sort-total').addEventListener('click', () => {
            sortField = 'total';
            sortAsc = !sortAsc;
            document.querySelectorAll('.sort-link').forEach(el => el.textContent = '↕');
            document.getElementById('sort-total').textContent = sortAsc ? '↑' : '↓';
            computeAvgCost();
        }
);

        // Load data
        loadBudgets();
        loadAccounts();
    });
</script>
</body>
</html>
