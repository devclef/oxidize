<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/api/manifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxidize - Sankey Flow</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3"></script>
    <style>
        .sankey-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .sankey-controls {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 20px;
            margin-bottom: 20px;
            align-items: start;
        }
        .control-panel {
            padding: 16px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
        }
        .control-panel h3 {
            margin: 0 0 10px 0;
            font-size: 0.85em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .control-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px;
            background: var(--bg-color);
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px;
            cursor: pointer;
            border-radius: var(--radius-sm);
        }
        .control-item:hover {
            background: var(--card-bg);
        }
        .control-item input[type="checkbox"] {
            accent-color: var(--accent-color);
        }
        .control-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }
        .control-actions button {
            padding: 4px 10px;
            font-size: 0.8em;
            cursor: pointer;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--card-bg);
            color: var(--text-color);
        }
        .control-actions button:hover {
            background: var(--border-light);
        }
        .flow-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .flow-option {
            padding: 8px 12px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 0.9em;
            text-align: left;
            transition: all 0.15s;
        }
        .flow-option:hover {
            border-color: var(--accent-color);
        }
        .flow-option.active {
            background: var(--accent-light);
            border-color: var(--accent-color);
            color: var(--accent-text);
            font-weight: 600;
        }
        .date-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
        .date-row input[type="date"] {
            padding: 4px 8px;
            font-size: 0.85em;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-color);
            color: var(--text-color);
        }
        .date-row label {
            font-size: 0.8em;
            color: var(--text-muted);
        }
        .compute-btn {
            padding: 10px 28px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: var(--radius-md);
            background: var(--accent-color);
            color: white;
            transition: background 0.15s;
            white-space: nowrap;
            align-self: center;
        }
        .compute-btn:hover {
            background: var(--accent-hover);
        }
        .compute-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .sankey-chart-wrapper {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
            padding: 20px;
            min-height: 400px;
        }
        .sankey-chart-wrapper h2 {
            margin: 0 0 12px 0;
            font-size: 1em;
            color: var(--text-color);
        }
        .sankey-svg-container {
            position: relative;
            width: 100%;
        }
        .sankey-svg-container svg {
            width: 100%;
            height: auto;
        }
        .sankey-node rect {
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .sankey-node:hover rect {
            opacity: 0.85;
        }
        .sankey-link {
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .sankey-link:hover {
            opacity: 0.6;
        }
        .sankey-label {
            font-size: 11px;
            pointer-events: none;
        }
        .sankey-amount {
            font-size: 10px;
            pointer-events: none;
        }
        .sankey-total-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 10px 16px;
            background: var(--border-light);
            border-radius: var(--radius-sm);
        }
        .sankey-total-bar .total-label {
            font-size: 0.85em;
            color: var(--text-muted);
        }
        .sankey-total-bar .total-amount {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--accent-color);
        }
        .loading-msg {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1em;
        }
        .error-msg {
            background: var(--error-bg);
            color: var(--error-color);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            border-left: 3px solid var(--error-color);
            font-size: 0.9em;
        }
        .tooltip-sankey {
            position: fixed;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px 10px;
            font-size: 0.8em;
            pointer-events: none;
            box-shadow: var(--shadow-md);
            z-index: 100;
            color: var(--text-color);
            max-width: 250px;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 1.4em;
        }
        .nav {
            margin-bottom: 20px;
        }
        @media (max-width: 900px) {
            .sankey-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none;">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39 -1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39 -1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39 -1.03-.39-1.41 0l-1.06 1.06c-.39-.39 -1.03 0 1.41 s1.03 .39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39 -1.03-.39-1.41 0l-1.06 1.06c-.39-.39 -1.03 0 1.41 s1.03 .39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
    </button>
    <nav class="nav">
        <a href="/">Graph Builder</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/summary">Summary</a>
        <a href="/budget-comparison">Budget Comparison</a>
        <a href="/avg-cost">Avg Cost</a>
        <a href="/sankey" class="active">Sankey Flow</a>
    </nav>

    <h1>Sankey Flow</h1>

    <div class="sankey-container">
        <div class="sankey-controls">
            <div class="control-panel">
                <h3>Source Accounts</h3>
                <div class="control-actions">
                    <button id="select-all-accounts">All</button>
                    <button id="deselect-all-accounts">None</button>
                </div>
                <div class="control-list" id="account-list">
                    <div class="loading-msg">Loading accounts...</div>
                </div>
            </div>

            <div class="control-panel">
                <h3>Flow Type</h3>
                <div class="flow-options">
                    <div class="flow-option active" data-type="destination" onclick="setFlowType('destination')">By Destination Account</div>
                    <div class="flow-option" data-type="category" onclick="setFlowType('category')">By Category</div>
                    <div class="flow-option" data-type="subcategory" onclick="setFlowType('subcategory')">By Subcategory</div>
                    <div class="flow-option" data-type="budget" onclick="setFlowType('budget')">By Budget</div>
                </div>
                <div class="date-row">
                    <div>
                        <label>From</label><br>
                        <input type="date" id="start-date">
                    </div>
                    <div>
                        <label>To</label><br>
                        <input type="date" id="end-date">
                    </div>
                </div>
            </div>

            <div>
                <button class="compute-btn" id="compute-btn">Generate</button>
            </div>
        </div>

        <div id="error-container" class="error-msg" style="display: none;"></div>

        <div class="sankey-chart-wrapper">
            <div id="total-bar" class="sankey-total-bar" style="display: none;">
                <span class="total-label">Total Flow</span>
                <span class="total-amount" id="total-amount">—</span>
            </div>
            <div id="chart-placeholder" class="loading-msg">Select source accounts and click Generate to see the flow diagram.</div>
            <div id="sankey-chart" class="sankey-svg-container" style="display: none;"></div>
        </div>
        <div id="tooltip" class="tooltip-sankey" style="display: none;"></div>
    </div>

<script>
    const THEME_KEY = 'oxidize_theme';
    let currentFlowType = 'destination';
    let sankeyChart = null;

    function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon-sun').style.display = 'none';
            document.getElementById('theme-icon-moon').style.display = 'block';
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.getElementById('theme-icon-sun').style.display = 'block';
            document.getElementById('theme-icon-moon').style.display = 'none';
        }
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem(THEME_KEY, next);
        document.getElementById('theme-icon-sun').style.display = next === 'light' ? 'block' : 'none';
        document.getElementById('theme-icon-moon').style.display = next === 'dark' ? 'block' : 'none';
        if (sankeyChart) renderSankey(sankeyChart);
    }

    function setFlowType(type) {
        currentFlowType = type;
        document.querySelectorAll('.flow-option').forEach(el => {
            el.classList.toggle('active', el.dataset.type === type);
        });
    }

    function formatCurrency(amount, symbol, code) {
        const s = symbol || code || '';
        const abs = Math.abs(amount);
        let formatted;
        if (abs >= 1000000) {
            formatted = (abs / 1000000).toFixed(1) + 'M';
        } else if (abs >= 1000) {
            formatted = abs.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        } else {
            formatted = abs.toFixed(2);
        }
        return (amount < 0 ? '-' : '') + s + formatted;
    }

    function getSelectedAccountIds() {
        return Array.from(document.querySelectorAll('.account-cb:checked')).map(cb => cb.value);
    }

    async function loadAccounts() {
        try {
            const CONFIG = window.OXIDIZE_CONFIG || { accountTypes: [] };
            const accounts = [];
            for (const type of CONFIG.accountTypes) {
                const resp = await fetch('/api/accounts?type=' + type);
                if (resp.ok) {
                    const arr = await resp.json();
                    accounts.push(...arr);
                }
            }
            const container = document.getElementById('account-list');
            if (accounts.length === 0) {
                container.innerHTML = '<div class="loading-msg">No accounts found.</div>';
                return;
            }
            container.innerHTML = accounts.map(a =>
                '<label class="control-item">' +
                    '<input type="checkbox" value="' + a.id + '" class="account-cb">' +
                    a.name +
                '</label>'
            ).join('');
        } catch (e) {
            document.getElementById('account-list').innerHTML =
                '<div class="error-msg">Failed to load accounts: ' + e.message + '</div>';
        }
    }

    async function generateSankey() {
        const accountIds = getSelectedAccountIds();
        const errorContainer = document.getElementById('error-container');
        const placeholder = document.getElementById('chart-placeholder');
        const chartDiv = document.getElementById('sankey-chart');
        const totalBar = document.getElementById('total-bar');

        if (accountIds.length === 0) {
            errorContainer.style.display = 'block';
            errorContainer.textContent = 'Please select at least one source account.';
            placeholder.style.display = 'block';
            chartDiv.style.display = 'none';
            totalBar.style.display = 'none';
            return;
        }

        errorContainer.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.textContent = 'Generating flow data...';
        chartDiv.style.display = 'none';
        totalBar.style.display = 'none';

        const startDate = document.getElementById('start-date').value || '';
        const endDate = document.getElementById('end-date').value || '';

        const params = new URLSearchParams();
        params.append('flow_type', currentFlowType);
        if (startDate) params.append('start', startDate);
        if (endDate) params.append('end', endDate);
        accountIds.forEach(id => params.append('accounts[]', id));

        try {
            const response = await fetch('/api/sankey/flows?' + params.toString());
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const data = await response.json();
            sankeyChart = data;
            try {
                renderSankey(data);
            } catch (e) {
                throw new Error('Render failed: ' + e.message);
            }
            placeholder.style.display = 'none';
            chartDiv.style.display = 'block';

            const symbol = data.currency_symbol || data.currency_code || '';
            document.getElementById('total-amount').textContent = formatCurrency(data.total, symbol);
            totalBar.style.display = 'flex';
        } catch (e) {
            errorContainer.textContent = 'Failed to generate flow data: ' + e.message;
            errorContainer.style.display = 'block';
            placeholder.textContent = 'Error generating flow.';
        }
    }

    function getThemeColors() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        return {
            textColor: isDark ? '#e2e8f0' : '#1a1a2e',
            mutedText: isDark ? '#94a3b8' : '#6b7280',
            nodeStroke: isDark ? '#334155' : '#d1d5db',
            linkBase: isDark ? 'rgba(148,163,184,' : 'rgba(100,116,139,',
        };
    }

    function renderSankey(data) {
        const chartDiv = document.getElementById('sankey-chart');
        chartDiv.innerHTML = '';
        const tooltip = document.getElementById('tooltip');

        const colors = getThemeColors();
        const symbol = data.currency_symbol || data.currency_code || '';

        const width = chartDiv.clientWidth || 1100;
        const height = Math.max(400, Math.min(700, width * 0.55));

        // Build unique nodes from links
        const nodeNames = new Set();
        data.links.forEach(l => {
            nodeNames.add(l.source);
            nodeNames.add(l.target);
        });
        const nodeNameList = Array.from(nodeNames);
        const nodeIndex = {};
        nodeNameList.forEach((name, i) => { nodeIndex[name] = i; });

        const nodes = nodeNameList.map(name => ({ name }));
        const links = data.links.map(l => ({
            source: nodeIndex[l.source],
            target: nodeIndex[l.target],
            value: l.amount,
            sourceName: l.source,
            targetName: l.target,
        }));

        if (nodes.length === 0 || links.length === 0) {
            document.getElementById('chart-placeholder').textContent = 'No flow data for the selected filters.';
            document.getElementById('chart-placeholder').style.display = 'block';
            chartDiv.style.display = 'none';
            return;
        }

        const svg = d3.select(chartDiv)
            .append('svg')
            .attr('viewBox', [0, 0, width, height])
            .attr('preserveAspectRatio', 'xMidYMid meet');

        // Color palette for source nodes (accounts)
        const sourceNames = [...new Set(links.map(l => l.sourceName))];
        const colorScale = d3.scaleOrdinal(d3.schemeTableau10).domain(sourceNames);

        const sankey = d3.sankey()
            .nodeWidth(14)
            .nodePadding(12)
            .extent([[10, 10], [width - 10, height - 10]])
            .nodeAlign(d3.sankeyLeft);

        const graph = sankey({
            nodes: nodes.map(d => Object.assign({}, d)),
            links: links.map(d => Object.assign({}, d)),
        });

        // Draw links
        svg.append('g')
            .attr('fill', 'none')
            .attr('stroke-width', 1)
            .selectAll('path')
            .data(graph.links)
            .join('path')
            .attr('class', 'sankey-link')
            .attr('d', d3.sankeyLinkHorizontal())
            .attr('stroke', d => {
                const c = colorScale(d.source.name);
                const r = parseInt(c.slice(1, 3), 16);
                const g = parseInt(c.slice(3, 5), 16);
                const b = parseInt(c.slice(5, 7), 16);
                return 'rgba(' + r + ',' + g + ',' + b + ',0.35)';
            })
            .attr('stroke-width', d => Math.max(1, d.width))
            .on('mouseover', function(event, d) {
                tooltip.style.display = 'block';
                tooltip.innerHTML = '<strong>' + d.source.name + '</strong><br>' +
                    '→ ' + d.target.name + '<br>' +
                    formatCurrency(d.value, symbol);
                tooltip.style.left = (event.clientX + 12) + 'px';
                tooltip.style.top = (event.clientY - 10) + 'px';
                d3.select(this).attr('stroke-opacity', 0.7);
            })
            .on('mousemove', function(event) {
                tooltip.style.left = (event.clientX + 12) + 'px';
                tooltip.style.top = (event.clientY - 10) + 'px';
            })
            .on('mouseout', function() {
                tooltip.style.display = 'none';
                d3.select(this).attr('stroke-opacity', 0.35);
            });

        // Draw nodes
        const nodeGroup = svg.append('g')
            .selectAll('g')
            .data(graph.nodes)
            .join('g')
            .attr('class', 'sankey-node');

        nodeGroup.append('rect')
            .attr('height', d => Math.max(d.y1 - d.y0, 4))
            .attr('width', d => 14)
            .attr('fill', d => {
                // Color source nodes (depth 0) by name, target nodes in muted color
                if (d.depth === 0) {
                    return colorScale(d.name);
                }
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                return isDark ? '#475569' : '#94a3b8';
            })
            .attr('rx', 3)
            .attr('stroke', colors.nodeStroke);

        // Node labels
        nodeGroup.append('text')
            .attr('class', 'sankey-label')
            .attr('x', d => d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6)
            .attr('y', d => d.y0 + 4)
            .attr('dy', '0.35em')
            .attr('fill', colors.textColor)
            .attr('text-anchor', d => d.x0 < width / 2 ? 'start' : 'end')
            .text(d => d.name)
            .each(function(d) {
                // Truncate long labels
                const text = d3.select(this);
                const maxLen = 25;
                if (d.name.length > maxLen) {
                    text.text(d.name.substring(0, maxLen) + '…');
                }
            });

        // Node amount labels
        nodeGroup.append('text')
            .attr('class', 'sankey-amount')
            .attr('fill', colors.mutedText)
            .attr('x', d => d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6)
            .attr('y', d => d.y1 - 2)
            .attr('text-anchor', d => d.x0 < width / 2 ? 'start' : 'end')
            .text(d => {
                const val = d.value || 0;
                const short = val >= 1000000
                    ? (val / 1000000).toFixed(1) + 'M'
                    : val >= 1000
                        ? (val / 1000).toFixed(1) + 'K'
                        : val.toFixed(0);
                return symbol + short;
            });
    }

    document.addEventListener('DOMContentLoaded', () => {
        initTheme();
        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }

        // Set default date range (last year)
        const now = new Date();
        const oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
        document.getElementById('end-date').value = now.toISOString().split('T')[0];
        document.getElementById('start-date').value = oneYearAgo.toISOString().split('T')[0];

        document.getElementById('select-all-accounts').addEventListener('click', () => {
            document.querySelectorAll('.account-cb').forEach(cb => cb.checked = true);
        });
        document.getElementById('deselect-all-accounts').addEventListener('click', () => {
            document.querySelectorAll('.account-cb').forEach(cb => cb.checked = false);
        });
        document.getElementById('compute-btn').addEventListener('click', generateSankey);

        loadAccounts();
    });
</script>
</body>
</html>
