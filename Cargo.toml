[package]
name = "oxidize"
version = "0.10.0"
edition = "2021"

[dependencies]
# http2 is left out: the server only speaks plain HTTP/1, and it pulls in the
# unmaintained h2 0.3 (RUSTSEC-2026-0258).
actix-web = { version = "4", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-files = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
serde_urlencoded = "0.7.1"
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
dirs = "7.0"
once_cell = "1.19"

[dev-dependencies]
mockito = "1.2"
tokio-test = "0.4"
